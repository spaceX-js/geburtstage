<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Geburtstage">
<meta name="format-detection" content="telephone=no">
<meta name="theme-color" content="#f4f0ec" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#161312" media="(prefers-color-scheme: dark)">
<meta name="robots" content="noindex, nofollow">
<link rel="apple-touch-icon" href="/icon.png">
<link rel="icon" href="/icon.png">
<link rel="manifest" href="/manifest.webmanifest">
<title>Geburtstage</title>
<style>
:root{
  --bg:#f4f0ec; --card:#ffffff; --ink:#1f1b18; --mute:#72675f; --line:#e8e0d8;
  --acc:#b4493a; --acc-ink:#fff; --acc-soft:#f6e3de; --ok:#2f6f5e; --ok-soft:#e1efe9; --warn:#9a6a00; --warn-soft:#fbefd2; --bad:#b3261e; --r:16px;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#161312; --card:#211c1a; --ink:#f3ede8; --mute:#a89d95; --line:#3a322e;
    --acc:#f0927f; --acc-ink:#2a120d; --acc-soft:#3b2420; --ok:#7cc4ad; --ok-soft:#1f3530; --warn:#e8c062; --warn-soft:#3a2f14; --bad:#f28b82; }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);
  font:16px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;-webkit-text-size-adjust:100%}
body{touch-action:manipulation}
button{font:inherit;color:inherit}
.wrap{max-width:600px;margin:0 auto;padding:0 calc(16px + env(safe-area-inset-right)) calc(110px + env(safe-area-inset-bottom)) calc(16px + env(safe-area-inset-left))}

/* Kopf */
.head{position:sticky;top:0;z-index:10;background:var(--bg);padding:calc(14px + env(safe-area-inset-top)) 16px 10px;margin:0 -16px}
.title{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:0 2px 10px;min-height:36px}
h1{font-size:26px;margin:0;letter-spacing:-.02em;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.net{font-size:12px;font-weight:600;color:var(--bad);margin-left:8px}
.iconbtn{background:none;border:0;color:var(--mute);padding:6px;cursor:pointer;border-radius:10px;flex:none}
.iconbtn svg{width:23px;height:23px;display:block}
.backbtn{background:none;border:0;color:var(--acc);font-weight:600;font-size:16px;padding:6px 0;cursor:pointer;flex:none}
.seg{display:flex;background:var(--line);border-radius:11px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:none;border-radius:9px;padding:8px 0;font-weight:600;font-size:14.5px;color:var(--mute);cursor:pointer}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}

/* Abschnitte & Listen */
.sec{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:20px 4px 8px}
.sec b{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--mute);font-weight:600}
.sec span,.sec .linkbtn{font-size:13px}
.list{background:var(--card);border-radius:var(--r);border:1px solid var(--line);overflow:hidden}
.row{display:flex;align-items:center;gap:12px;width:100%;padding:12px 14px;background:none;border:0;border-top:1px solid var(--line);text-align:left;cursor:pointer}
.row:first-child{border-top:0}
.row:active{background:var(--bg)}
.row .main{flex:1;min-width:0}
.n{font-size:16px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.d{font-size:13.5px;color:var(--mute);margin-top:2px}
.chev{flex:none;color:var(--line);font-size:22px;line-height:1}
.date{flex:none;width:46px;text-align:center;border-radius:12px;background:var(--bg);padding:5px 0}
.date b{display:block;font-size:19px;line-height:1.1;font-variant-numeric:tabular-nums}
.date small{display:block;font-size:11px;color:var(--mute);text-transform:uppercase;letter-spacing:.04em}
.date.soon{background:var(--acc-soft)}.date.soon b{color:var(--acc)}
.avatar{flex:none;width:40px;height:40px;border-radius:50%;background:var(--acc-soft);color:var(--acc);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:16px}
.empty{text-align:center;color:var(--mute);padding:28px 16px;font-size:15px}
.empty .btn{margin-top:14px}
.linkbtn{background:none;border:0;color:var(--acc);font-weight:600;font-size:14px;padding:6px 4px;cursor:pointer}

/* Kennzeichen */
.pill{display:inline-block;font-size:12px;font-weight:600;border-radius:7px;padding:1px 7px;margin-left:6px;vertical-align:1px;white-space:nowrap}
.pill.round{background:var(--warn-soft);color:var(--warn)}
.pill.s-none{background:var(--acc-soft);color:var(--acc)}
.pill.s-idee{background:var(--warn-soft);color:var(--warn)}
.pill.s-gekauft,.pill.s-verpackt{background:var(--ok-soft);color:var(--ok)}
.pill.s-ueberreicht{background:var(--ok);color:var(--card)}
.pill.s-nichts{background:var(--line);color:var(--mute)}
.d .pill:first-child{margin-left:0}
.by{color:var(--acc);font-weight:600}

/* Karten auf der Personenseite */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin:0 0 12px}
.kv{display:flex;justify-content:space-between;gap:12px;padding:7px 0;border-top:1px solid var(--line);font-size:15px}
.kv:first-child{border-top:0;padding-top:0}.kv:last-child{padding-bottom:0}
.kv span{color:var(--mute);flex:none}.kv b{font-weight:600;text-align:right}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tag{font-size:13.5px;border-radius:999px;padding:4px 11px;background:var(--bg);border:1px solid var(--line)}
.txt{white-space:pre-wrap;font-size:15px;margin:4px 0 0}
.lab{font-size:13px;color:var(--mute);margin:12px 0 4px}.lab:first-child{margin-top:0}
form.add{display:flex;gap:8px;margin:0 0 10px}
form.add input{flex:1;min-width:0;font:inherit;font-size:16px;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:12px;padding:11px 13px;-webkit-appearance:none}
form.add input:focus{outline:2px solid var(--acc);outline-offset:-1px}
form.add button{border:0;border-radius:12px;background:var(--acc);color:var(--acc-ink);font-weight:700;font-size:22px;width:46px;cursor:pointer}
.ideas .row{cursor:default}
.ideas .row a{color:var(--acc);font-weight:600;text-decoration:none}
.more{flex:none;background:none;border:0;color:var(--mute);padding:8px 4px 8px 10px;cursor:pointer;font-size:20px;line-height:1}
.yr{font-size:13px;font-weight:700;color:var(--mute);margin:12px 4px 6px}
.stars{color:var(--warn);letter-spacing:1px}
.searchbox{width:100%;font:inherit;font-size:16px;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:12px;padding:11px 13px;margin-top:10px;-webkit-appearance:none}
.searchbox:focus{outline:2px solid var(--acc);outline-offset:-1px}
.fab{position:fixed;right:calc(18px + env(safe-area-inset-right));bottom:calc(22px + env(safe-area-inset-bottom));z-index:20;border:0;border-radius:999px;background:var(--acc);color:var(--acc-ink);
  font-weight:700;font-size:16px;padding:14px 20px;box-shadow:0 6px 20px rgba(0,0,0,.18);cursor:pointer}
@media (min-width:640px){ .fab{right:calc(50% - 300px + 18px)} }
.whobox{background:var(--acc-soft);border-radius:14px;padding:12px 14px;margin:12px 0 0}
.whobox .small{margin:2px 0 10px}
.whobox .chips button{background:var(--card);font-weight:600;padding:8px 18px}
.alert{border-radius:12px;padding:10px 12px;font-size:14px;margin:12px 0 0;background:var(--warn-soft);color:var(--warn)}

/* Dialog */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.38);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--card);width:100%;max-width:600px;border-radius:20px 20px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));max-height:92vh;overflow:auto;animation:up .2s ease-out}
@media (min-width:640px){ .scrim{align-items:center} .sheet{border-radius:20px} }
@keyframes up{from{transform:translateY(30px);opacity:.6}to{transform:none;opacity:1}}
.sheet h3{margin:0 0 4px;font-size:19px}
.sheet .sub{color:var(--mute);font-size:14px;margin:0 0 14px}
label.f{display:block;margin:0 0 12px}
label.f > span,.flab{display:block;font-size:13px;color:var(--mute);margin:0 0 5px}
.sheet input,.sheet select,.sheet textarea{width:100%;font:inherit;font-size:16px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;-webkit-appearance:none;appearance:none}
.sheet textarea{min-height:76px;resize:vertical}
.sheet select{background-image:linear-gradient(45deg,transparent 50%,var(--mute) 50%),linear-gradient(135deg,var(--mute) 50%,transparent 50%);background-position:calc(100% - 18px) 52%,calc(100% - 13px) 52%;background-size:5px 5px;background-repeat:no-repeat;padding-right:32px}
.three{display:grid;grid-template-columns:1fr 1.5fr 1.2fr;gap:8px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:7px 12px;font-size:14px;cursor:pointer}
.chips button.on{background:var(--acc);border-color:var(--acc);color:var(--acc-ink)}
.acts{display:flex;gap:8px;margin-top:16px}
.btn{flex:1;border:0;border-radius:12px;padding:12px 16px;font-weight:600;background:var(--acc);color:var(--acc-ink);cursor:pointer;font-size:16px}
.btn.ghost{background:transparent;color:var(--acc);border:1px solid var(--line)}
.btn.block{display:block;width:100%;margin-bottom:8px}
.btn.danger{background:transparent;color:var(--bad);border:1px solid var(--line)}
.btn.sm{flex:none;padding:8px 14px;font-size:14px}
.btn:disabled{opacity:.55}
.xrow{display:grid;grid-template-columns:1.6fr .8fr 1.2fr 1fr auto;gap:6px;margin-bottom:6px;align-items:center}
.xrow input,.xrow select{padding:9px 8px;font-size:15px}
.xrow button{background:var(--bg);border:1px solid var(--line);border-radius:10px;width:36px;height:42px;cursor:pointer;color:var(--mute)}
.small{font-size:13px;color:var(--mute)}
.hr{height:1px;background:var(--line);margin:16px 0}
.gift{border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:10px}
.gift .top{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.gift .top b{font-size:16px}
.steps{display:flex;gap:4px;margin-top:10px;flex-wrap:wrap}
.steps button{flex:1;min-width:70px;border:1px solid var(--line);background:var(--bg);border-radius:9px;padding:7px 4px;font-size:13px;font-weight:600;color:var(--mute);cursor:pointer}
.steps button.on{background:var(--ok);border-color:var(--ok);color:var(--card)}
.picklist{display:flex;flex-direction:column;gap:6px}
.picklist button{display:flex;justify-content:space-between;gap:8px;text-align:left;border:1px dashed var(--line);background:var(--bg);border-radius:10px;padding:9px 12px;font-size:14.5px;cursor:pointer}
.picklist button small{color:var(--mute);flex:none}
.spin{width:28px;height:28px;border:3px solid var(--line);border-top-color:var(--acc);border-radius:50%;animation:sp 1s linear infinite;margin:0 auto 12px}
@keyframes sp{to{transform:rotate(360deg)}}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 8px 8px 16px;border-radius:12px;font-size:14px;z-index:60;box-shadow:0 8px 24px rgba(0,0,0,.2);display:flex;align-items:center;gap:12px;max-width:calc(100% - 32px);width:max-content}
.toast span{flex:1;min-width:0;padding:6px 0}

/* Geburtstage */
.hero{display:flex;gap:14px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin:12px 0}
.hero .big{font-size:38px;line-height:1}
.hero b{display:block;font-size:20px;letter-spacing:-.01em}
.hero .hs{display:block;color:var(--mute);font-size:14.5px;margin-top:2px}
.today{display:flex;gap:14px;align-items:center;width:100%;text-align:left;cursor:pointer;background:var(--acc-soft);border:0;border-radius:var(--r);padding:14px 16px;margin:0 0 8px}
.today .big{font-size:34px;line-height:1}
.today b{display:block;font-size:17px}
.today small{display:block;color:var(--mute);font-size:13.5px;margin-top:2px}
.hint{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 10px 10px 14px;margin:12px 0 0;font-size:14.5px}
.hint span{flex:1}
.hint .x{background:none;border:0;color:var(--mute);font-size:15px;padding:6px;cursor:pointer}
.gifthead{font-size:19px;font-weight:700;margin:26px 4px 0;padding-top:18px;border-top:1px solid var(--line)}
.sheet h4{margin:0 0 10px;font-size:16px}
details.more-sec{border:1px solid var(--line);border-radius:12px;padding:0 12px;margin-top:16px}
details.more-sec summary{cursor:pointer;font-weight:600;padding:12px 0;list-style:none}
details.more-sec summary::-webkit-details-marker{display:none}
details.more-sec summary:after{content:"›";float:right;color:var(--mute);transition:transform .15s}
details.more-sec[open] summary:after{transform:rotate(90deg)}
details.more-sec[open]{padding-bottom:4px}
.budget{display:flex;justify-content:space-between;align-items:center;gap:8px;background:var(--bg);border-radius:12px;padding:8px 12px;margin:0 0 14px;font-size:14.5px}
.budget-edit{background:var(--bg);border-radius:12px;padding:10px 12px;margin:0 0 14px}
.budget-edit input{background:var(--card)}
/* Kalender */
.calnav{display:flex;align-items:center;justify-content:space-between;margin:14px 0 8px}
.calnav .iconbtn{font-size:28px;line-height:1;color:var(--acc);padding:2px 12px}
.calttl{background:none;border:0;font-size:19px;font-weight:700;cursor:pointer;padding:4px 8px}
.month{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:8px 6px}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.grid .wd{text-align:center;font-size:11.5px;color:var(--mute);font-weight:600;padding:2px 0 6px}
.grid button{min-height:58px;border:0;background:none;border-radius:10px;padding:4px 2px;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;min-width:0;overflow:hidden}
.grid button .dn{font-size:14px;font-variant-numeric:tabular-nums;width:26px;height:26px;line-height:26px;border-radius:50%;flex:none}
.grid button.now .dn{background:var(--ink);color:var(--bg);font-weight:700}
.grid button.ev{background:var(--acc-soft)}
.grid button.ev .dn{color:var(--acc);font-weight:700}
.grid button.now.ev .dn{background:var(--acc);color:var(--acc-ink)}
.grid button.sel{outline:2px solid var(--acc);outline-offset:-2px}
.grid .who{font-size:10.5px;line-height:1.2;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--ink)}
.grid .who.more{color:var(--mute)}
.grid button.hol{background:var(--warn-soft)}
.grid button.hol .dn{color:var(--warn);font-weight:700}
.grid .who.holw{color:var(--warn);font-size:10px}
.date.hold{background:var(--warn-soft)}.date.hold b{color:var(--warn)}
.mgrid i.hol{background:var(--warn-soft);color:var(--warn);font-weight:700}
.legend{display:flex;gap:16px;justify-content:center;font-size:12.5px;color:var(--mute);margin:12px 0 0}
.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px;vertical-align:-1px}
.legend i.ev{background:var(--acc)}.legend i.hol{background:var(--warn-soft);outline:1px solid var(--warn)}
.yeargrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
@media (min-width:520px){.yeargrid{grid-template-columns:repeat(4,1fr)}}
.mini{display:flex;flex-direction:column;justify-content:flex-start;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 6px;cursor:pointer;text-align:left;min-width:0}
.mini b{display:block;font-size:13px;margin:0 2px 4px}
.mini .cnt{display:inline-block;background:var(--acc);color:var(--acc-ink);border-radius:999px;font-size:10.5px;padding:0 6px;margin-left:2px;vertical-align:1px}
.mgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:1px}
.mgrid i{font-style:normal;font-size:9px;text-align:center;line-height:15px;color:var(--mute);border-radius:50%;font-variant-numeric:tabular-nums}
.mgrid i.ev{background:var(--acc);color:var(--acc-ink);font-weight:700}
.mgrid i.now{outline:1.5px solid var(--ink)}
/* KI-Vorschläge */
.aibox{border:1px dashed var(--acc);border-radius:14px;padding:12px;margin-top:16px;background:color-mix(in srgb,var(--acc-soft) 45%,transparent)}
.aibox input{background:var(--card)}
.sugglist{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.sugg{display:flex;flex-direction:column;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.sugg b{font-size:15px}
.sugg .sb{display:flex;gap:6px}
.sugg .sb .btn{flex:1}
/* Ausgaben */
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.stats div{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.stats small{display:block;color:var(--mute);font-size:13px}
.stats b{display:block;font-size:24px;letter-spacing:-.02em;margin:2px 0}
.stats span{font-size:13px;color:var(--mute)}
.bar{display:flex;height:6px;border-radius:3px;background:var(--bg);overflow:hidden;margin:6px 0 4px}
.bar i{display:block;background:var(--acc)}
.bar i.pl{background:var(--warn);opacity:.55}
.yearbars{display:flex;gap:6px;align-items:flex-end}
.yearbars button{flex:1;border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer;padding:0;color:var(--mute)}
.yearbars .yb{height:90px;width:100%;max-width:38px;display:flex;align-items:flex-end;background:var(--bg);border-radius:8px;overflow:hidden}
.yearbars .yb i{display:block;width:100%;background:var(--acc);opacity:.45;border-radius:8px 8px 0 0}
.yearbars button.on .yb i{opacity:1}
.yearbars button.on{color:var(--ink);font-weight:700}
.yearbars .yv{font-size:11px;white-space:nowrap}
.yearbars .yl{font-size:12.5px}
label.check{display:flex;gap:10px;align-items:flex-start;font-size:14.5px;margin-top:12px;cursor:pointer}
.sheet label.check input{width:20px;height:20px;flex:none;margin:1px 0 0;-webkit-appearance:checkbox;appearance:auto;accent-color:var(--acc)}
.toast button{background:none;border:0;color:var(--acc-soft);font-weight:700;padding:6px 8px;cursor:pointer}
</style>
</head>
<body>
<div class="wrap">
  <div class="head" id="head"></div>
  <main id="app"><div class="empty"><div class="spin"></div>Wird geladen …</div></main>
</div>
<div id="fab"></div>
<div id="modal"></div>
<div id="toast"></div>
<script type="module" src="/app.js"></script>
</body>
</html>
